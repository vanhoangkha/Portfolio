name: Deploy to GitHub Pages

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build site
        run: |
          echo "Preparing files for GitHub Pages..."
          echo "Portfolio is static HTML/CSS/JS - ready to deploy!"
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      
      - name: Deployment Summary
        run: |
          echo "╔════════════════════════════════════════════╗"
          echo "║   GITHUB PAGES DEPLOYMENT SUCCESS!     ║"
          echo "╚════════════════════════════════════════════╝"
          echo ""
          echo "Your portfolio is now live at:"
          echo "   https://vanhoangkha.github.io/Portfolio/"
          echo ""
          echo "Pages deployed:"
          echo "   • Homepage:  https://vanhoangkha.github.io/Portfolio/"
          echo "   • Resume:    https://vanhoangkha.github.io/Portfolio/resume.html"
          echo "   • Blog:      https://vanhoangkha.github.io/Portfolio/blog.html"
          echo ""
          echo "Features active:"
          echo "   Glass morphism effects"
          echo "   Magnetic buttons"
          echo "   3D card animations"
          echo "   Animated gradients"
          echo "   Scroll reveals"
          echo "   Dark mode"
          echo ""
          echo "Portfolio is LIVE!"

